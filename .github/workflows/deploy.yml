name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 빌드한 사이트를 gh-pages 브랜치에 올린다. Pages 설정에서 이 브랜치를 그대로 보여 주게 한다.
# (Actions 방식의 Pages 업로드가 새 계정에서 'syncing_files'로 멈춰 이 방식으로 바꿨다)
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Push dist to gh-pages
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
